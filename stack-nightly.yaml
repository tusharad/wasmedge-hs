# Stack configuration for wasmedge-hs
# Snapshot: Stackage Nightly (GHC 9.12.x)

snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/nightly/2026/9/9.yaml

packages:
  - .

allow-newer: true

extra-include-dirs:
  - /opt/homebrew/include
  - /usr/local/include
  - /usr/include

extra-lib-dirs:
  - /opt/homebrew/lib
  - /usr/local/lib
  - /usr/lib
