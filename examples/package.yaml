name: wasmedge-hs-examples
version: 0.1.0.0
github: "tusharad/wasmedge-hs/examples"
license: MIT
author: "Tushar Adhatrao"
maintainer: "tusharadhatrao@gmail.com"
copyright: "2026 Tushar Adhatrao"

extra-source-files:
  - README.md
  - CHANGELOG.md

synopsis: Examples for the wasmedge-hs Haskell bindings
description: |
  A collection of standalone examples demonstrating how to use the wasmedge-hs
  library: running WASM modules, writing host functions, AOT compilation, and
  plugin discovery.
  Please see the README on GitHub at <https://github.com/tusharad/wasmedge-hs/tree/main/examples#readme>

dependencies:
  - base >= 4.18 && < 5
  - wasmedge-hs
  - bytestring
  - text

language: GHC2021

default-extensions:
  - ImportQualifiedPost

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wredundant-constraints
  - -Wmissing-export-lists
  - -Wno-unused-do-bind

executables:
  wasmedge-hs-example-hello:
    main: Main.hs
    source-dirs: app/hello
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

  wasmedge-hs-example-hostfunc:
    main: Main.hs
    source-dirs: app/hostfunc
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

  wasmedge-hs-example-aot:
    main: Main.hs
    source-dirs: app/aot
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base >= 4.18 && < 5
      - wasmedge-hs
      - bytestring
      - filepath
      - temporary

  wasmedge-hs-example-plugin:
    main: Main.hs
    source-dirs: app/plugin
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N


