# Stack configuration for wasmedge-hs
# Default snapshot: Stackage LTS 22.44 (GHC 9.6.6)

snapshot:
  url: https://raw.githubusercontent.com/commercialhaskell/stackage-snapshots/master/lts/22/44.yaml

packages:
  - .

# Extra include and library directories for WasmEdge C API
# Supports Apple Silicon Homebrew (/opt/homebrew), Intel Homebrew (/usr/local), and Linux
extra-include-dirs:
  - /opt/homebrew/include
  - /usr/local/include
  - /usr/include

extra-lib-dirs:
  - /opt/homebrew/lib
  - /usr/local/lib
  - /usr/lib
